run_name: baseline_mlp_mnist
seed: 0
deterministic: false
dataset:
  name: mnist
  batch_size: 128
  num_workers: 0
model:
  name: mlp
  hidden: [256, 256]
  dropout: 0.0
optim:
  name: adamw
  lr: 0.001
  weight_decay: 0.0001
sched:
  name: cosine
  warmup_epochs: 1
train:
  epochs: 10
  amp: true
  grad_clip: 1.0
  label_smoothing: 0.0
  eval_every: 1
  eval_every_steps: 50      # 데이터 효율 곡선용 (표본 수 대 정확도)
  progress: false
